[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easymusicdl"
version = "2026.11.21"
description = "Desktop GUI for downloading music as MP3 (powered by yt-dlp)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Danil Borkov", email = "vokrob.dev@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.3.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0",
]

[project.scripts]
easymusicdl = "ytdlp_gui.main:main"

[project.urls]
Homepage = "https://github.com/DreamOver9183/EzMusicDL"
Repository = "https://github.com/DreamOver9183/EzMusicDL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytdlp_gui = ["assets/*"]


